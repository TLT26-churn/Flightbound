name: Addon checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y luajit python3-pil fonts-dejavu-core
      - name: Rules and progression
        run: |
          luajit tests/idle-game.lua
          luajit tests/idle-simulate.lua
      - name: UI, animation and sound calls
        run: |
          luajit tests/idle-ui.lua
          python3 tests/render_idle.py
      - name: Portable ZIP
        run: python3 tools/package.py
