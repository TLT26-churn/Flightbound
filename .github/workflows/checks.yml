name: Addon checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y luajit python3-pil
      - name: Game and messaging checks
        run: |
          luajit tests/flightbound-game.lua
          luajit tests/flightbound-critical.lua
          luajit tests/flightbound-social.lua
          luajit tests/flightbound-social-client.lua
      - name: UI and layer checks
        run: |
          luajit tests/flightbound-ui.lua --animation
          python3 tests/render_flightbound.py --check-layer-order --animation
      - name: Validate installable ZIP
        run: python3 tools/package.py
